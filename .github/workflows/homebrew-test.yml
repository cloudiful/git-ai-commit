name: Homebrew scripts

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/homebrew/**"
      - ".github/workflows/homebrew-test.yml"
      - ".github/workflows/bump-homebrew-tap.yml"
  pull_request:
    paths:
      - ".github/scripts/homebrew/**"
      - ".github/workflows/homebrew-test.yml"
      - ".github/workflows/bump-homebrew-tap.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Run offline generator tests
        run: >-
          uv run --no-project python -m unittest discover
          -s .github/scripts/homebrew -p 'test_*.py' -v

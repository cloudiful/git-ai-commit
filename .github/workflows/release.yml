name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-amd64
            target: x86_64-unknown-linux-gnu
            asset_name: git-ai-commit-linux-amd64
            binary_path: target/x86_64-unknown-linux-gnu/release/git-ai-commit
          - os: ubuntu-24.04-arm
            target_name: linux-arm64
            target: aarch64-unknown-linux-gnu
            asset_name: git-ai-commit-linux-arm64
            binary_path: target/aarch64-unknown-linux-gnu/release/git-ai-commit
          - os: ubuntu-latest
            target_name: linux-amd64-musl
            target: x86_64-unknown-linux-musl
            asset_name: git-ai-commit-linux-amd64-musl
            binary_path: target/x86_64-unknown-linux-musl/release/git-ai-commit
          - os: macos-26
            target_name: macos-arm64
            target: aarch64-apple-darwin
            asset_name: git-ai-commit-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/git-ai-commit
          - os: windows-latest
            target_name: windows-amd64
            target: x86_64-pc-windows-msvc
            asset_name: git-ai-commit-windows-amd64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/git-ai-commit.exe
          - os: windows-11-arm
            target_name: windows-arm64
            target: aarch64-pc-windows-msvc
            asset_name: git-ai-commit-windows-arm64.exe
            binary_path: target/aarch64-pc-windows-msvc/release/git-ai-commit.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install musl build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake musl-tools
          musl-gcc --version

      - name: Configure musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Prepare Unix release artifacts
        if: runner.os != 'Windows'
        run: |
          install -m 0755 "${{ matrix.binary_path }}" "${{ matrix.asset_name }}"
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Verify musl release artifact
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          test -x "${{ matrix.binary_path }}"
          file "${{ matrix.binary_path }}" | grep -E 'ELF 64-bit.*x86-64'
          if readelf -l "${{ matrix.binary_path }}" | grep -q 'INTERP'; then
            echo "musl binary must not contain a dynamic loader" >&2
            exit 1
          fi
          sha256sum -c "${{ matrix.asset_name }}.sha256"

      - name: Prepare Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.binary_path }}" "${{ matrix.asset_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset_name }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset_name }}" | Out-File -FilePath "${{ matrix.asset_name }}.sha256" -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: git-ai-commit-${{ matrix.target_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  release-tag:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: git-ai-commit-*-${{ github.run_id }}
          path: dist
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  release-latest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: git-ai-commit-*-${{ github.run_id }}
          path: dist
          merge-multiple: true

      - name: Publish latest prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            dist/*
          fail_on_unmatched_files: true

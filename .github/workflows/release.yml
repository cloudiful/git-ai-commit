name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-amd64
            target: x86_64-unknown-linux-gnu
            asset_name: git-ai-commit-linux-amd64
            binary_path: target/x86_64-unknown-linux-gnu/release/git-ai-commit
          - os: ubuntu-24.04-arm
            target_name: linux-arm64
            target: aarch64-unknown-linux-gnu
            asset_name: git-ai-commit-linux-arm64
            binary_path: target/aarch64-unknown-linux-gnu/release/git-ai-commit
          - os: ubuntu-latest
            target_name: linux-amd64-musl
            target: x86_64-unknown-linux-musl
            asset_name: git-ai-commit-linux-amd64-musl
            binary_path: target/x86_64-unknown-linux-musl/release/git-ai-commit
          - os: macos-26
            target_name: macos-arm64
            target: aarch64-apple-darwin
            asset_name: git-ai-commit-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/git-ai-commit
          - os: windows-latest
            target_name: windows-amd64
            target: x86_64-pc-windows-msvc
            zip_name: git-ai-commit-windows-amd64.zip
            msi_name: git-ai-commit-windows-amd64.msi
            binary_path: target/x86_64-pc-windows-msvc/release/git-ai-commit.exe
          - os: windows-11-arm
            target_name: windows-arm64
            target: aarch64-pc-windows-msvc
            zip_name: git-ai-commit-windows-arm64.zip
            msi_name: git-ai-commit-windows-arm64.msi
            binary_path: target/aarch64-pc-windows-msvc/release/git-ai-commit.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0

      - name: Install musl build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake musl-tools
          musl-gcc --version

      - name: Configure musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"

      - name: Build release binary
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_BASEDIRS: ${{ github.workspace }}
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Show sccache stats
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_BASEDIRS: ${{ github.workspace }}
        run: sccache --show-stats

      - name: Prepare Unix release artifacts
        if: runner.os != 'Windows'
        run: |
          install -m 0755 "${{ matrix.binary_path }}" "${{ matrix.asset_name }}"
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Verify musl release artifact
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          test -x "${{ matrix.binary_path }}"
          file "${{ matrix.binary_path }}" | grep -E 'ELF 64-bit.*x86-64'
          if readelf -l "${{ matrix.binary_path }}" | grep -q 'INTERP'; then
            echo "musl binary must not contain a dynamic loader" >&2
            exit 1
          fi
          sha256sum -c "${{ matrix.asset_name }}.sha256"

      - name: Prepare Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.binary_path }}" "git-ai-commit.exe"
          Compress-Archive -Path "git-ai-commit.exe" -DestinationPath "${{ matrix.zip_name }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.zip_name }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.zip_name }}" | Out-File -FilePath "${{ matrix.zip_name }}.sha256" -Encoding ascii
          Remove-Item "git-ai-commit.exe" -Force

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $tools = "$env:USERPROFILE\.dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          $env:PATH = "$tools;$env:PATH"
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix --version
          wix extension list --global

      # WiX MSI path. Built for both Windows matrix targets (x64 and arm64);
      # the per-target arch and artifact names come from the matrix so no
      # amd64/arm64 names are hardcoded. The WiX compiler emits a `.wixpdb`
      # sidecar next to the MSI; it is deleted and never uploaded. All three
      # WiX sources (git-ai-commit, Shortcuts, ShortcutOptionsDlg) compile
      # together so the MSI keeps the per-user Start Menu/Desktop shortcut
      # options.
      - name: Build MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $msiVersion = $tag -replace '^v', ''
          if ($msiVersion -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' must be strict numeric MAJOR.MINOR.PATCH (for example v1.2.3)."
            exit 1
          }
          $zipName = '${{ matrix.zip_name }}'
          $msiName = '${{ matrix.msi_name }}'
          if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') {
            $wixArch = 'arm64'
          } else {
            $wixArch = 'x64'
          }
          New-Item -ItemType Directory -Force -Path msi-stage | Out-Null
          Copy-Item -Path "${{ matrix.binary_path }}" -Destination 'msi-stage\git-ai-commit.exe' -Force
          $wixLog = 'wix-build-${{ matrix.target }}.log'
          if (Test-Path $wixLog) { Remove-Item $wixLog -Force }
          wix build wix/git-ai-commit.wxs wix/Shortcuts.wxs wix/ShortcutOptionsDlg.wxs -arch $wixArch -d SourceDir=msi-stage -d Version=$msiVersion -ext WixToolset.UI.wixext -o $msiName *>&1 | Tee-Object -FilePath $wixLog
          if ($LASTEXITCODE -ne 0) {
            $wixExit = $LASTEXITCODE
            $wixDetail = ''
            if (Test-Path $wixLog) {
              $wixLines = Get-Content -Path $wixLog | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 20
              $wixDetail = ($wixLines -join ' ')
              if ($wixDetail.Length -gt 2000) { $wixDetail = $wixDetail.Substring($wixDetail.Length - 2000) }
              $wixDetail = $wixDetail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            }
            if ([string]::IsNullOrWhiteSpace($wixDetail)) { $wixDetail = 'see wix-build log artifact' }
            Write-Output "::error::wix build failed (exit $wixExit): $wixDetail"
            exit $wixExit
          }
          $msiHash = (Get-FileHash -Algorithm SHA256 $msiName).Hash.ToLowerInvariant()
          "$msiHash  $msiName" | Out-File -FilePath "$msiName.sha256" -Encoding ascii
          # Never publish the WiX pdb sidecar or build logs on success.
          Remove-Item *.wixpdb -Force -ErrorAction SilentlyContinue
          if (Test-Path $wixLog) { Remove-Item $wixLog -Force }
          Get-ChildItem $zipName, $msiName

      - name: Upload WiX build log (Windows)
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: wix-build-log-${{ matrix.target }}
          path: wix-build-${{ matrix.target }}.log
          if-no-files-found: warn

      # Explicit artifact paths only: no wildcards that could pick up
      # `.wixpdb` or logs. Non-Windows uploads only the raw binary; the
      # Windows step uploads the zip plus the MSI produced by the matrix step.
      - name: Upload release artifacts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: git-ai-commit-${{ matrix.target_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error

      - name: Upload release artifacts (Windows with MSI)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: git-ai-commit-${{ matrix.target_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.zip_name }}
            ${{ matrix.zip_name }}.sha256
            ${{ matrix.msi_name }}
            ${{ matrix.msi_name }}.sha256
          if-no-files-found: error

  release-tag:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: git-ai-commit-*-${{ github.run_id }}
          path: dist
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

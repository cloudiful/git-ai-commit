[package]
name = "git-ai-commit"
version = "0.1.8"
edition = "2024"

[dependencies]
async-openai = { version = "0.41.3", default-features = false, features = ["rustls", "responses", "chat-completion", "model"] }
clap = { version = "4.6.6", features = [ "derive" ] }
config = { package = "cloudiful-config", version = "0.6.3" }
crossterm = "0.29.0"
futures = "0.3.34"
redactor = { package = "cloudiful-redactor", version = "0.5.1" }
reqwest = { version = "0.13.4", default-features = false, features = [ "json", "rustls" ] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", features = [ "macros", "rt" ] }
toml = "1.1.5"
